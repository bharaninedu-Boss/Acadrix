<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>R-2025 1-Mark Quick Quiz | ACADRIX</title>
<meta name="description" content="ACADRIX R-2025 Mechanical Engineering 1-mark quick quiz.">
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:22px;line-height:1.55;color:#172033;background:#f8fafc}h1{color:#1d4ed8}.panel{background:#fff;padding:20px;border:1px solid #dbe4f0;border-radius:16px;margin:16px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:1rem}button{background:#1d4ed8;color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}.option{display:block;margin:9px 0;padding:11px;border:1px solid #dbe4f0;border-radius:10px;cursor:pointer}.option:hover{background:#f1f5f9}.muted{color:#64748b}.hidden{display:none}.progress{font-weight:700;color:#475569}.result{font-size:1.1rem;font-weight:700}.feedback{margin:12px 0;padding:12px;border-radius:10px;background:#f1f5f9}.review{margin-top:18px}
</style></head>
<body>
<a href="index.html">← 1-Mark Question Bank</a>
<h1>⚡ R-2025 1-Mark Quick Quiz</h1>
<p class="muted">ACADRIX practice mode • R-2025 only. The quiz uses the published question-bank answers as the answer key.</p>
<section id="setup" class="panel"><h2>Choose your practice</h2><div class="controls">
<label>Subject<select id="subject"><option value="ME25C03">ME25C03 — Introduction to Mechanical Engineering</option><option value="MA25C01">MA25C01 — Applied Calculus</option></select></label>
<label>Unit<select id="unit"></select></label>
<label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label>
</div><br><button id="start">Start Quiz</button><p id="availability" class="muted"></p></section>
<section id="quiz" class="panel hidden"><div class="progress" id="progress"></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="next">Check Answer</button></section>
<section id="result" class="panel hidden"><h2>Quiz Complete 🎉</h2><p class="result" id="score"></p><div id="review" class="review"></div><button onclick="location.reload()">Try Again</button></section>
<script>
const bank={ME25C03:{units:{1:'ME25C03_Unit1.json',2:'ME25C03_Unit2.json',3:'ME25C03_Unit3.json',4:'ME25C03_Unit4.json',5:'ME25C03_Unit5.json'}},MA25C01:{units:{1:'MA25C01_Unit1.json',2:'MA25C01_Unit2.json',3:'MA25C01_Unit3.json',4:'MA25C01_Unit4.json'}}};
let questions=[],index=0,score=0,results=[],checked=false;const $=id=>document.getElementById(id);
function shuffle(a){return a.sort(()=>Math.random()-0.5)}
function updateUnits(){const units=bank[$('subject').value].units;$('unit').innerHTML='<option value="all">All available units</option>'+Object.keys(units).map(u=>`<option value="${u}">Unit ${['I','II','III','IV','V'][u-1]}</option>`).join('');availability()}
async function loadQuestions(){const s=$('subject').value,u=$('unit').value;let units=Object.entries(bank[s].units);if(u!=='all')units=units.filter(x=>x[0]===u);const loaded=[];for(const [unit,file] of units){try{const r=await fetch(file);if(!r.ok)continue;const d=await r.json();(d.questions||[]).forEach(q=>{if(q.a)loaded.push({...q,unit})})}catch(e){}}return loaded}
async function availability(){const q=await loadQuestions();$('availability').textContent=q.length?`${q.length} answer-keyed questions available for this selection.`:'No answer-keyed package is available for this selection yet.'}
$('subject').onchange=updateUnits;$('unit').onchange=availability;updateUnits();
$('start').onclick=async()=>{const all=await loadQuestions();questions=shuffle(all).slice(0,+$('count').value);if(!questions.length){alert('No answer-keyed question package is available for this selection yet.');return}index=0;score=0;results=[];$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');show()};
function show(){checked=false;const q=questions[index];$('progress').textContent=`Question ${index+1} of ${questions.length} • Unit ${q.unit}`;$('question').textContent=q.q;$('feedback').classList.add('hidden');$('next').textContent='Check Answer';const distractors=shuffle(questions.filter(x=>x.id!==q.id&&x.a!==q.a).map(x=>x.a)).slice(0,3);const opts=shuffle([q.a,...distractors]);$('options').innerHTML=opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" data-answer="${encodeURIComponent(o)}"> ${o}</label>`).join('');$('next').onclick=checkAnswer}
function checkAnswer(){if(checked)return;const selected=document.querySelector('input[name="answer"]:checked');if(!selected){alert('Select an answer before continuing.');return}checked=true;const q=questions[index],chosen=decodeURIComponent(selected.dataset.answer),correct=chosen===q.a;if(correct)score++;results.push({q:q.q,chosen,correct:q.a});document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);$('feedback').classList.remove('hidden');$('feedback').innerHTML=correct?'✅ Correct!':`❌ Incorrect. <strong>Correct answer:</strong> ${q.a}`;$('next').textContent=index===questions.length-1?'Finish':'Next';$('next').onclick=nextQuestion}
function nextQuestion(){if(index<questions.length-1){index++;show()}else finish()}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(score/questions.length*100);$('score').textContent=`Score: ${score}/${questions.length} (${pct}%)`;const wrong=results.filter(r=>r.chosen!==r.correct);$('review').innerHTML=wrong.length?'<h3>Review incorrect answers</h3>'+wrong.map(r=>`<p><strong>${r.q}</strong><br>Your answer: ${r.chosen}<br>Correct answer: ${r.correct}</p>`).join(''):'<h3>Perfect score! 🎯</h3>'}
</script></body></html>
