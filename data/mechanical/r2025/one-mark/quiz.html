<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>R-2025 1-Mark Quick Quiz | ACADRIX</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:22px;line-height:1.55;color:#172033;background:#f8fafc}h1{color:#1d4ed8}.panel{background:#fff;padding:20px;border:1px solid #dbe4f0;border-radius:16px;margin:16px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}select,button,input[type=search]{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:1rem}button{background:#1d4ed8;color:#fff;border:0;cursor:pointer;font-weight:700}.option{display:block;margin:9px 0;padding:11px;border:1px solid #dbe4f0;border-radius:10px;cursor:pointer}.option:hover{background:#eff6ff}.muted{color:#64748b}.hidden{display:none}.progress{font-weight:700;color:#475569}.result{font-size:1.1rem;font-weight:700}.feedback{padding:12px;border-radius:10px;margin:12px 0}.correct{background:#ecfdf5;color:#166534}.wrong{background:#fef2f2;color:#991b1b}.timer{font-weight:800;color:#b45309}.setup-note{background:#eff6ff;border-left:4px solid #2563eb;padding:12px;border-radius:8px}.review{padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0}.review strong{display:block}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.result-actions{grid-template-columns:1fr}}</style></head><body><a href="index.html">← 1-Mark Question Bank</a><h1>⚡ R-2025 1-Mark Quick Quiz</h1><p class="muted">ACADRIX practice mode • R-2025 only.</p><section id="setup" class="panel"><h2>Choose your practice</h2><div class="controls"><label>Subject<select id="subject"><option value="ME25C03">ME25C03 — Introduction to Mechanical Engineering</option><option value="MA25C01">MA25C01 — Applied Calculus</option><option value="MA25C02">MA25C02 — Linear Algebra</option></select></label><label>Unit<select id="unit"></select></label><label>Difficulty<select id="difficulty"><option value="all">All difficulties</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label><label>Mode<select id="mode"><option value="practice">Practice mode</option><option value="timed">Timed mode — 60 sec/question</option></select></label></div><br><div class="setup-note">💡 Practice mode gives explanations after each answer. Timed mode adds a countdown and automatically ends when time expires.</div><br><button id="start">Start Quiz</button><p id="availability" class="muted"></p></section><section id="quiz" class="panel hidden"><div class="progress" id="progress"></div><div class="timer" id="timer"></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><button id="next">Next</button></section><section id="result" class="panel hidden"><h2>Quiz Complete 🎉</h2><p class="result" id="score"></p><div id="summary"></div><div class="result-actions"><button onclick="location.reload()">Try Again</button><button onclick="location.href='quiz.html'">New Quiz</button></div></section><script>const bank={ME25C03:{units:{1:'ME25C03_Unit1_MCQ.json',2:'ME25C03_Unit2_MCQ.json',3:'ME25C03_Unit3_MCQ.json',4:'ME25C03_Unit4_MCQ.json',5:'ME25C03_Unit5_MCQ.json'}},MA25C01:{units:{1:'MA25C01_Unit1_MCQ.json',2:'MA25C01_Unit2_MCQ.json',3:'MA25C01_Unit3_MCQ.json',4:'MA25C01_Unit4_MCQ.json'}},MA25C02:{units:{1:'MA25C02_Unit1_MCQ.json',2:'MA25C02_Unit2_MCQ.json',3:'MA25C02_Unit3_MCQ.json',4:'MA25C02_Unit4_MCQ.json'}}};let questions=[],index=0,score=0,answered=false,timerId=null,timeLeft=0,answers=[];const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-0.5)}function setUnits(){const s=$('subject').value;$('unit').innerHTML='<option value="all">All available units</option>'+Object.keys(bank[s].units).map(u=>`<option value="${u}">Unit ${u}</option>`).join('')}async function loadQuestions(){const s=$('subject').value,u=$('unit').value,diff=$('difficulty').value;let units=Object.entries(bank[s].units);if(u!=='all')units=units.filter(x=>x[0]===u);const loaded=[];for(const [unit,file] of units){try{const r=await fetch(file);if(!r.ok)continue;const d=await r.json();(d.questions||[]).forEach(q=>{if(Array.isArray(q.options)&&q.options.length===4&&q.answer&&(!q.difficulty||diff==='all'||q.difficulty===diff))loaded.push({...q,unit})})}catch(e){}}return loaded}async function availability(){const q=await loadQuestions();$('availability').textContent=q.length?`${q.length} authored MCQs currently available for this selection.`:'No authored MCQ package is available for this selection yet.'}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}function startTimer(){if($('mode').value!=='timed'){ $('timer').textContent='';return}timeLeft=questions.length*60;updateTimer();timerId=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){stopTimer();finish(true)}},1000)}function updateTimer(){const m=Math.floor(timeLeft/60),s=String(timeLeft%60).padStart(2,'0');$('timer').textContent=`⏱ Time remaining: ${m}:${s}`}function show(){answered=false;const q=questions[index];$('progress').textContent=`Question ${index+1} of ${questions.length} • Unit ${q.unit}${q.difficulty?' • '+q.difficulty:''}`;$('question').textContent=q.q;$('feedback').className='';$('feedback').textContent='';$('options').innerHTML=shuffle(q.options.map(o=>({text:o,correct:o===q.answer}))).map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${String(i)}" data-text="${String(o.text).replace(/"/g,'&quot;')}" data-correct="${o.correct}"> ${String.fromCharCode(65+i)}. ${o.text}</label>`).join('');$('next').textContent=index===questions.length-1?'Finish':'Next'}function advance(){if(index<questions.length-1){index++;show()}else finish(false)}function checkAnswer(){if(answered)return;const selected=document.querySelector('input[name="answer"]:checked');if(!selected){alert('Select an answer before continuing.');return}answered=true;const q=questions[index],ok=selected.dataset.correct==='true';answers[index]={selected:selected.dataset.text,correct:q.answer,ok};if(ok)score++;if($('mode').value==='practice'){$('feedback').className='feedback '+(ok?'correct':'wrong');$('feedback').textContent=ok?'✓ Correct! '+q.explanation:'✗ Incorrect. Correct answer: '+q.answer+' — '+q.explanation;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);$('next').onclick=advance;$('next').textContent=index===questions.length-1?'Finish':'Continue'}else advance()}function finish(timeUp){stopTimer();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(score/questions.length*100);$('score').textContent=`You scored ${score}/${questions.length} (${pct}%).${timeUp?' Time expired.':''}`;const weak={};questions.forEach((q,i)=>{if(!answers[i]||!answers[i].ok)weak[q.unit]=(weak[q.unit]||0)+1});const weakText=Object.keys(weak).length?Object.entries(weak).map(([u,n])=>`Unit ${u}: ${n} missed`).join(' • '):'No weak unit detected 🎉';$('summary').innerHTML=`<p><strong>Review focus:</strong> ${weakText}</p><details><summary>View answer review</summary>${questions.map((q,i)=>{const a=answers[i];return `<div class="review"><strong>${i+1}. ${q.q}</strong><span>${a&&a.ok?'✓ Correct':'✗ Correct answer: '+q.answer}</span></div>`}).join('')}</details>`}$('subject').onchange=()=>{setUnits();availability()};$('unit').onchange=availability;$('difficulty').onchange=availability;$('start').onclick=async()=>{const all=await loadQuestions();const requested=+$('count').value;if(all.length<requested){if(!confirm(`Only ${all.length} matching MCQs are available. Start with ${all.length}?`))return}questions=shuffle(all).slice(0,requested);if(!questions.length){alert('No authored MCQ package is available for this selection yet.');return}index=0;score=0;answers=[];$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');$('next').onclick=checkAnswer;show();startTimer()};setUnits();availability();</script></body></html>
