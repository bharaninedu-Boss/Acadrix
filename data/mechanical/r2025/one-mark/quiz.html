<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>R-2025 1-Mark Quick Quiz | ACADRIX</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:22px;line-height:1.55;color:#172033;background:#f8fafc}h1{color:#1d4ed8}.panel{background:#fff;padding:20px;border:1px solid #dbe4f0;border-radius:16px;margin:16px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:1rem}button{background:#1d4ed8;color:#fff;border:0;cursor:pointer;font-weight:700}.option{display:block;margin:9px 0;padding:11px;border:1px solid #dbe4f0;border-radius:10px;cursor:pointer}.option:hover{background:#eff6ff}.muted{color:#64748b}.hidden{display:none}.progress{font-weight:700;color:#475569}.result{font-size:1.1rem;font-weight:700}.feedback{padding:12px;border-radius:10px;margin:12px 0}.correct{background:#ecfdf5;color:#166534}.wrong{background:#fef2f2;color:#991b1b}</style></head><body><a href="index.html">← 1-Mark Question Bank</a><h1>⚡ R-2025 1-Mark Quick Quiz</h1><p class="muted">ACADRIX practice mode • R-2025 only.</p><section id="setup" class="panel"><h2>Choose your practice</h2><div class="controls"><label>Subject<select id="subject"><option value="ME25C03">ME25C03 — Introduction to Mechanical Engineering</option><option value="MA25C01">MA25C01 — Applied Calculus</option></select></label><label>Unit<select id="unit"></select></label><label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label></div><br><button id="start">Start Quiz</button><p id="availability" class="muted"></p></section><section id="quiz" class="panel hidden"><div class="progress" id="progress"></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><button id="next">Next</button></section><section id="result" class="panel hidden"><h2>Quiz Complete 🎉</h2><p class="result" id="score"></p><button onclick="location.reload()">Try Again</button></section><script>const bank={ME25C03:{units:{1:'ME25C03_Unit1_MCQ.json',2:'ME25C03_Unit2_MCQ.json',3:'ME25C03_Unit3_MCQ.json',4:'ME25C03_Unit4_MCQ.json',5:'ME25C03_Unit5_MCQ.json'}},MA25C01:{units:{1:'MA25C01_Unit1_MCQ.json',2:'MA25C01_Unit2_MCQ.json',3:'MA25C01_Unit3_MCQ.json',4:'MA25C01_Unit4_MCQ.json'}}};let questions=[],index=0,score=0,answered=false;const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-0.5)}function setUnits(){const s=$('subject').value;$('unit').innerHTML='<option value="all">All available units</option>'+Object.keys(bank[s].units).map(u=>`<option value="${u}">Unit ${u}</option>`).join('')}async function loadQuestions(){const s=$('subject').value,u=$('unit').value;let units=Object.entries(bank[s].units);if(u!=='all')units=units.filter(x=>x[0]===u);const loaded=[];for(const [unit,file] of units){try{const r=await fetch(file);if(!r.ok)continue;const d=await r.json();(d.questions||[]).forEach(q=>{if(Array.isArray(q.options)&&q.options.length===4&&q.answer)loaded.push({...q,unit})})}catch(e){}}return loaded}async function availability(){const q=await loadQuestions();$('availability').textContent=q.length?`${q.length} authored MCQs currently available for this selection.`:'No authored MCQ package is available for this selection yet.'}function show(){answered=false;const q=questions[index];$('progress').textContent=`Question ${index+1} of ${questions.length} • Unit ${q.unit}`;$('question').textContent=q.q;$('feedback').className='';$('feedback').textContent='';$('options').innerHTML=shuffle(q.options.map(o=>({text:o,correct:o===q.answer}))).map((o,i)=>`<label class="option"><input type="radio" name="answer" data-correct="${o.correct}"> ${String.fromCharCode(65+i)}. ${o.text}</label>`).join('');$('next').textContent=index===questions.length-1?'Finish':'Next')}function advance(){if(index<questions.length-1){index++;$('next').onclick=checkAnswer;show()}else finish()}function checkAnswer(){if(answered)return;const selected=document.querySelector('input[name="answer"]:checked');if(!selected){alert('Select an answer before continuing.');return}answered=true;const ok=selected.dataset.correct==='true';if(ok)score++;$('feedback').className='feedback '+(ok?'correct':'wrong');const q=questions[index];$('feedback').textContent=ok?'✓ Correct! '+q.explanation:'✗ Incorrect. Correct answer: '+q.answer+' — '+q.explanation;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);$('next').onclick=advance;$('next').textContent=index===questions.length-1?'Finish':'Continue'}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(score/questions.length*100);$('score').textContent=`You scored ${score}/${questions.length} (${pct}%).`}$('subject').onchange=()=>{setUnits();availability()};$('unit').onchange=availability;$('start').onclick=async()=>{const all=await loadQuestions();questions=shuffle(all).slice(0,+$('count').value);if(!questions.length){alert('No authored MCQ package is available for this selection yet.');return}index=0;score=0;$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');$('next').onclick=checkAnswer;show()};setUnits();availability();</script></body></html>
