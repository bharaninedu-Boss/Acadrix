<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>R-2025 1-Mark Quick Quiz | ACADRIX</title>
<meta name="description" content="ACADRIX R-2025 Mechanical Engineering 1-mark quick quiz interface.">
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:22px;line-height:1.55;color:#172033;background:#f8fafc}h1{color:#1d4ed8}.panel{background:#fff;padding:20px;border:1px solid #dbe4f0;border-radius:16px;margin:16px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:1rem}button{background:#1d4ed8;color:#fff;border:0;cursor:pointer;font-weight:700}.option{display:block;margin:9px 0;padding:11px;border:1px solid #dbe4f0;border-radius:10px;cursor:pointer}.muted{color:#64748b}.hidden{display:none}.progress{font-weight:700;color:#475569}.result{font-size:1.1rem;font-weight:700}
</style></head>
<body>
<a href="index.html">← 1-Mark Question Bank</a>
<h1>⚡ R-2025 1-Mark Quick Quiz</h1>
<p class="muted">ACADRIX practice mode • R-2025 only. Questions are drawn from published ACADRIX question-bank JSON files.</p>
<section id="setup" class="panel">
<h2>Choose your practice</h2>
<div class="controls">
<label>Subject<select id="subject"><option value="ME25C03">ME25C03 — Introduction to Mechanical Engineering</option><option value="MA25C01">MA25C01 — Applied Calculus</option></select></label>
<label>Unit<select id="unit"><option value="all">All available units</option><option value="1">Unit I</option><option value="2">Unit II</option><option value="3">Unit III</option><option value="4">Unit IV</option><option value="5">Unit V</option></select></label>
<label>Questions<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label>
</div><br><button id="start">Start Quiz</button>
<p id="availability" class="muted"></p>
</section>
<section id="quiz" class="panel hidden"><div class="progress" id="progress"></div><h2 id="question"></h2><div id="options"></div><button id="next">Next</button></section>
<section id="result" class="panel hidden"><h2>Quiz Complete 🎉</h2><p class="result" id="score"></p><button onclick="location.reload()">Try Again</button></section>
<script>
const bank={
 ME25C03:{units:{1:'ME25C03_Unit1.json',2:'ME25C03_Unit2.json',3:'ME25C03_Unit3.json',4:'ME25C03_Unit4.json',5:'ME25C03_Unit5.json'}},
 MA25C01:{units:{1:'MA25C01_Unit1.json',2:'MA25C01_Unit2.json',3:'MA25C01_Unit3.json',4:'MA25C01_Unit4.json'}}
};
let questions=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return a.sort(()=>Math.random()-0.5)}
async function loadQuestions(){
 const s=$('subject').value,u=$('unit').value; let units=Object.entries(bank[s].units); if(u!=='all') units=units.filter(x=>x[0]===u);
 const loaded=[]; for(const [unit,file] of units){try{const r=await fetch(file);if(!r.ok)continue;const d=await r.json();(d.questions||[]).forEach(q=>loaded.push({...q,unit}))}catch(e){}}
 return loaded;
}
async function availability(){const q=await loadQuestions();$('availability').textContent=q.length?`${q.length} practice questions currently available for this selection.`:'No published question package is available for this selection yet.'}
$('subject').onchange=()=>{const s=$('subject').value;if(s==='MA25C01'){$('unit').innerHTML='<option value="all">All available units</option><option value="1">Unit I</option><option value="2">Unit II</option><option value="3">Unit III</option><option value="4">Unit IV</option>'}else{$('unit').innerHTML='<option value="all">All available units</option><option value="1">Unit I</option><option value="2">Unit II</option><option value="3">Unit III</option><option value="4">Unit IV</option><option value="5">Unit V</option>'}availability()};
$('unit').onchange=availability; availability();
$('start').onclick=async()=>{questions=shuffle(await loadQuestions()).slice(0,+$('count').value);if(!questions.length){alert('No question package is available for this selection yet.');return}index=0;score=0;$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');show()};
function show(){answered=false;const q=questions[index];$('progress').textContent=`Question ${index+1} of ${questions.length} • Unit ${q.unit}`;$('question').textContent=q.question;const opts=shuffle([q.answer||'Review the concept carefully',...(q.options||[])]);$('options').innerHTML=opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"> ${o}</label>`).join('');$('next').textContent=index===questions.length-1?'Finish':'Next'}
$('next').onclick=()=>{const selected=document.querySelector('input[name="answer"]:checked');if(!selected){alert('Select an answer before continuing.');return}index++;if(index<questions.length)show();else finish()};
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`You completed ${questions.length} questions. Score: ${score}/${questions.length}.`;}
</script>
</body></html>
