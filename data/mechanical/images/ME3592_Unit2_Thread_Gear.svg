<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="600" y="40" text-anchor="middle" font-size="28" font-weight="700">ME3592 Unit II — Thread &amp; Gear Measurement</text><g transform="translate(60,85)"><text x="250" y="0" text-anchor="middle" font-size="22" font-weight="700">Three-Wire Method</text><path d="M70 120 Q150 40 230 120 T390 120" fill="none" stroke="#172033" stroke-width="5"/><circle cx="120" cy="105" r="16" fill="#fff" stroke="#172033" stroke-width="3"/><circle cx="340" cy="105" r="16" fill="#fff" stroke="#172033" stroke-width="3"/><circle cx="230" cy="55" r="16" fill="#fff" stroke="#172033" stroke-width="3"/><line x1="120" y1="25" x2="340" y2="25" stroke="#172033" stroke-width="3"/><text x="230" y="15" text-anchor="middle" font-size="16">micrometer contact</text><text x="230" y="190" text-anchor="middle" font-size="17">one wire on one side + two on the other</text><text x="230" y="215" text-anchor="middle" font-size="17">used to determine effective / pitch diameter</text></g><g transform="translate(600,85)"><text x="250" y="0" text-anchor="middle" font-size="22" font-weight="700">Gear Measurement Checks</text><circle cx="250" cy="115" r="85" fill="none" stroke="#172033" stroke-width="4"/><circle cx="250" cy="115" r="58" fill="none" stroke="#172033" stroke-width="3" stroke-dasharray="8 5"/><g stroke="#172033" stroke-width="3"><line x1="250" y1="20" x2="250" y2="210"/><line x1="155" y1="115" x2="345" y2="115"/></g><text x="250" y="250" text-anchor="middle" font-size="17">Runout • pitch variation • tooth profile</text><text x="250" y="275" text-anchor="middle" font-size="17">tooth thickness • lead • rolling/functional check</text></g><g transform="translate(140,365)"><rect x="0" y="0" width="920" height="120" rx="12" fill="none" stroke="#172033" stroke-width="3"/><text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700">Analytical vs Functional</text><text x="25" y="65" font-size="17">Analytical: measure individual gear elements separately.</text><text x="25" y="94" font-size="17">Functional: check actual meshing/rolling behaviour with a mating or master gear.</text></g></g></svg>