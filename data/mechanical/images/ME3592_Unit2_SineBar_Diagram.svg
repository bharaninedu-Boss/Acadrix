<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>ME3592 — Sine Bar: Principle</title><rect width="1200" height="650" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:22px}.title{font-size:30px;font-weight:700}.dim{stroke:#2563eb;stroke-width:3;fill:none}</style><text x="600" y="45" text-anchor="middle" class="title">ME3592 — Sine Bar: Principle</text><rect x="180" y="430" width="840" height="35" fill="#cbd5e1" stroke="#334155" stroke-width="5"/><circle cx="230" cy="410" r="48" fill="#e5e7eb" stroke="#334155" stroke-width="5"/><circle cx="970" cy="410" r="48" fill="#e5e7eb" stroke="#334155" stroke-width="5"/><rect x="245" y="300" width="700" height="38" transform="rotate(-8 245 300)" fill="#94a3b8" stroke="#334155" stroke-width="5"/><g fill="#e5e7eb" stroke="#334155" stroke-width="3"><rect x="900" y="360" width="35" height="50"/><rect x="900" y="315" width="35" height="45"/><rect x="900" y="275" width="35" height="40"/></g><line x1="230" y1="410" x2="970" y2="410" stroke="#64748b" stroke-dasharray="12 8" stroke-width="3"/><line x1="970" y1="410" x2="970" y2="275" class="dim"/><line x1="230" y1="410" x2="970" y2="410" class="dim"/><text x="560" y="500" class="label">L = distance between roller centres</text><text x="985" y="350" class="label">h</text><text x="500" y="265" class="label">Workpiece</text><text x="600" y="575" text-anchor="middle" class="label">sin θ = h / L</text><text x="600" y="615" text-anchor="middle" class="label">h = L sin θ</text></svg>