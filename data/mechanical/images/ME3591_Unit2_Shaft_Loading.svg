<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.shaft{stroke:#334155;stroke-width:18;stroke-linecap:round}.thin{stroke:#475569;stroke-width:2;fill:none}.load{stroke:#1d4ed8;stroke-width:4;fill:none}.torque{stroke:#dc2626;stroke-width:4;fill:none}.dim{stroke:#64748b;stroke-width:2;fill:none}.label{font-size:20px;font-weight:700}.small{font-size:16px}</style><text x="40" y="38" class="label">ME3591 Unit II — Shaft loading concept</text><line x1="100" y1="210" x2="900" y2="210" class="shaft"/><circle cx="280" cy="210" r="42" class="thin"/><circle cx="700" cy="210" r="55" class="thin"/><polygon points="280,130 250,165 310,165" fill="#94a3b8"/><polygon points="700,130 670,165 730,165" fill="#94a3b8"/><line x1="280" y1="115" x2="280" y2="55" class="load"/><polygon points="280,55 270,75 290,75" fill="#1d4ed8"/><text x="220" y="48" class="small">Radial load</text><line x1="700" y1="325" x2="700" y2="265" class="load"/><polygon points="700,265 690,285 710,285" fill="#1d4ed8"/><text x="640" y="350" class="small">Radial load</text><path d="M400 150 A60 60 0 1 0 520 150" class="torque"/><polygon points="520,150 500,145 510,165" fill="#dc2626"/><text x="425" y="105" class="small">Torque T</text><line x1="280" y1="385" x2="700" y2="385" class="dim"/><line x1="280" y1="375" x2="280" y2="395" class="dim"/><line x1="700" y1="375" x2="700" y2="395" class="dim"/><text x="455" y="410" class="small">Bearing span / shaft length</text><text x="60" y="250" class="small">Shaft carries bending moment M</text><text x="60" y="275" class="small">and torsional moment T</text></svg>