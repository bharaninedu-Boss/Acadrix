<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="1000" height="380" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.outline{stroke:#334155;stroke-width:4;fill:#e2e8f0}.hole{stroke:#334155;stroke-width:4;fill:white}.dim{stroke:#64748b;stroke-width:2;fill:none}.label{font-size:21px;font-weight:700}.small{font-size:17px}</style><text x="40" y="38" class="label">Solid vs hollow shaft — section view</text><circle cx="270" cy="190" r="105" class="outline"/><text x="190" y="335" class="small">Solid shaft</text><circle cx="720" cy="190" r="115" class="outline"/><circle cx="720" cy="190" r="65" class="hole"/><text x="645" y="335" class="small">Hollow shaft</text><line x1="165" y1="190" x2="375" y2="190" class="dim"/><text x="245" y="175" class="small">D</text><line x1="605" y1="190" x2="835" y2="190" class="dim"/><text x="730" y="175" class="small">Do</text><line x1="655" y1="190" x2="785" y2="190" class="dim"/><text x="710" y="210" class="small">Di</text><text x="450" y="85" class="small">For a given weight and length,</text><text x="450" y="110" class="small">moving material away from the centre</text><text x="450" y="135" class="small">increases the polar moment J.</text></svg>