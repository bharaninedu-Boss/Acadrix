<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>ME3592 — Autocollimator: Optical Principle</title><rect width="1200" height="650" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:22px}.title{font-size:30px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="600" y="45" text-anchor="middle" class="title">ME3592 — Autocollimator: Optical Principle</text><rect x="120" y="220" width="500" height="170" rx="30" fill="#e5e7eb" stroke="#334155" stroke-width="5"/><circle cx="170" cy="305" r="55" fill="#f8fafc" stroke="#334155" stroke-width="5"/><rect x="580" y="265" width="50" height="80" fill="#94a3b8" stroke="#334155" stroke-width="4"/><g transform="rotate(-7 850 300)"><rect x="820" y="180" width="55" height="240" fill="#cbd5e1" stroke="#334155" stroke-width="5"/></g><line x1="620" y1="305" x2="820" y2="305" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><line x1="820" y1="305" x2="620" y2="270" stroke="#16a34a" stroke-width="6"/><text x="150" y="445" class="label">Eye piece / optical system</text><text x="700" y="155" class="label">Plane reflector</text><text x="700" y="500" class="label">Small reflector tilt = θ</text><text x="600" y="555" text-anchor="middle" class="label">Reflected beam deviation ≈ 2θ</text></svg>