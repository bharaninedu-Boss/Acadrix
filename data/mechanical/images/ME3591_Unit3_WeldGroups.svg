<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.p{fill:#e2e8f0;stroke:#334155;stroke-width:3}.w{fill:#f59e0b;stroke:#334155;stroke-width:2}.a{stroke:#dc2626;stroke-width:4;fill:none}.s{font-size:17px}.t{font-size:20px;font-weight:700}</style><text x="35" y="35" class="t">Weld group loading — visual guide</text><rect x="70" y="100" width="170" height="220" class="p"/><rect x="240" y="120" width="25" height="180" class="w"/><line x1="265" y1="120" x2="500" y2="120" class="w"/><line x1="265" y1="300" x2="500" y2="300" class="w"/><line x1="500" y1="120" x2="500" y2="300" class="w"/><line x1="500" y1="210" x2="700" y2="210" class="a"/><polygon points="700,210 675,198 675,222" fill="#dc2626"/><text x="330" y="345" class="s">Rectangular fillet-weld group</text><text x="710" y="205" class="s">External load P</text><text x="710" y="230" class="s">creates direct shear</text><text x="710" y="255" class="s">and, if eccentric, moment M = Pe</text><path d="M650 330 A55 55 0 1 0 650 90" class="a"/><text x="715" y="330" class="s">Moment / torsion</text></svg>