<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU Notes | Anna University Engineering Resources</title>
    <meta name="description" content="Free Anna University engineering notes, previous year question papers, important questions, and video resources for R2021 and R2025.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
    <header>
        <nav class="container">
            <div class="logo" onclick="navigateTo('home')">
                <span class="logo-icon">⚙️</span>
                <span class="logo-text">AU <span class="highlight">Notes</span></span>
            </div>
            
            <div class="nav-links">
                <button onclick="navigateTo('home')">Home</button>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search code or subject..." oninput="handleSearch()">
                    <div id="searchResults" class="search-results"></div>
                </div>
                <button id="themeToggle" class="theme-btn">🌙</button>
            </div>
        </nav>
    </header>

    <main id="app" class="container">
        <!-- Content will be injected here by script.js -->
    </main>

    <footer class="container">
        <div class="footer-content">
            <p><strong>AU Notes</strong> - Engineering Resource Portal</p>
            <p class="disclaimer">AU Notes is an independent student resource and is NOT officially affiliated with Anna University. Third-party resources are linked to their original sources; we do not claim ownership of third-party content.</p>
            <div class="footer-links">
                <span>Regulation 2021</span>
                <span>Regulation 2025</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
